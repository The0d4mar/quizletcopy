services:
  postgres:
    image: postgres:17-alpine
    container_name: remfront-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: remfront
    ports:
      - "5432:5432"
    volumes:
      - remfront-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d remfront"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  remfront-postgres-data:
